[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "auto-checkpoint"
version = "0.1.0"
description = "Fail-closed Git work checkpoint, commit, push and recovery"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
  {name = "JamPeter"}
]
keywords = ["git", "checkpoint", "backup", "recovery", "automation"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX",
]

[project.scripts]
auto-checkpoint = "auto_checkpoint.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
