name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Quality pilot dependencies
        run: |
          python3 -m pip install ruff .
          python3 -m pip install "git+https://github.com/jam2peter/quality-gate.git@v0"

      - name: Unit and integration tests
        run: PYTHONPATH=src python3 -m unittest discover -s tests -p 'test_*.py' -v

      - name: Repository Quality Gate
        run: quality-gate run --config .jampeter/quality-gate.toml

      - name: Verify repository quality report
        run: quality-gate verify-report --report .quality-gate/report.json --config .jampeter/quality-gate.toml

      - name: Package smoke
        run: auto-checkpoint --help >/dev/null

      - name: Sanitization scan
        shell: bash
        run: |
          set -euo pipefail
          ! grep -RInE '/home/jam|jha-auto-checkpoint|Alfredo-Haras|JÃO|Haras|JamPeter-Infrastructure'             --exclude-dir=.git --exclude=ci.yml .
          ! grep -RInE '192\.168\.|10\.[0-9]+\.[0-9]+\.[0-9]+|172\.(1[6-9]|2[0-9]|3[01])\.'             --exclude-dir=.git --exclude=ci.yml .
          ! grep -RInE '(ghp_|github_pat_|AIza[0-9A-Za-z_-]{20,}|BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY)'             --exclude-dir=.git --exclude=ci.yml --exclude=quality_security_scan.py .
